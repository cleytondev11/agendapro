<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14121a">
  <meta name="robots" content="noindex, nofollow">
  <title>Central de Acessos · AgendaPro</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root{--ac:#4f8cff}
    .emp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
    .emp:last-child{border-bottom:0}
    .emp .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px}
    .emp .t{font-weight:700}
    .emp .d{color:var(--mut);font-size:.83rem;margin-top:3px;line-height:1.5}
    .emp .d a{color:var(--ac);text-decoration:none}
    .pill.ativa{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
    .pill.vencida,.pill.bloqueada{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
    .pill.teste{background:color-mix(in srgb,#b48cff 22%,transparent);color:#c9adff}
    .sino{position:relative;padding-inline:14px}
    .sino .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-style:normal;font-size:.68rem;font-weight:800;border-radius:99px;padding:2px 6px;min-width:20px;text-align:center}
    .pill.avencer{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
    .msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;margin-top:10px}
    .slugbox{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding-left:12px}
    .slugbox span{color:var(--mut);font-size:.85rem;white-space:nowrap}
    .slugbox input{border:0;background:transparent;padding-left:2px}
    .pwd{display:flex;gap:6px}
    .tabs-f{display:flex;gap:6px;flex-wrap:wrap}
    .tabs-f button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--mut)}
    .tabs-f button.on{background:var(--ac);border-color:var(--ac);color:#fff}
    @media (max-width:700px){.emp{grid-template-columns:auto 1fr}.emp .acts{grid-column:1/-1}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modal-title"></h3><button class="icon-btn" onclick="closeModal()" aria-label="Fechar">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/nichos.js"></script>
  <script src="/central.js"></script>
</body>
</html>
