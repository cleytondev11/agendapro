<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{NEGOCIO}} · Loja online</title>
<meta name="description" content="Produtos de {{NEGOCIO}}: escolha, peça e pague pelo celular.">
<meta property="og:title" content="{{NEGOCIO}} · Loja online">
<meta property="og:description" content="Escolha seus produtos, faça o pedido e pague pelo celular.">
<meta name="theme-color" content="#16121c">
<link rel="icon" href="{{ICONE}}">
<link rel="apple-touch-icon" href="{{ICONE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#d9668f;--ink:#16121c;--tx:#1d1724;--mut:#7a7084;--line:#ece6f0;--bg:#f7f4f9;--card:#fff;--ok:#1f9d6a;--warn:#c98a12;--bad:#d64545;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:500 15px/1.45 'Manrope',system-ui,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
/* topo */
.hero{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--ac) 55%,transparent) 0%,transparent 60%),radial-gradient(100% 120% at 100% 100%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 60%),var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 0 54px}
.hero .wrap{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:64px;height:64px;border-radius:18px;background:var(--ac);display:grid;place-items:center;font-size:30px;overflow:hidden;box-shadow:0 10px 30px -10px #000}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-family:'Fraunces',Georgia,serif;font-size:1.55rem;line-height:1.1}
.hero p{opacity:.8;font-size:.86rem;margin-top:3px}
.hero .wa{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;background:#25d366;color:#06301a;font-weight:800;font-size:.82rem;border-radius:99px;padding:9px 13px;text-decoration:none}
.hero .wa svg{width:16px;height:16px}
.msg{max-width:1080px;margin:14px auto 0;padding:0 16px;color:#fff;opacity:.92;font-size:.92rem}
.tools{max-width:1080px;margin:-30px auto 0;padding:0 16px;position:relative}
.busca{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:0 14px 34px -18px #2a1640;border:1px solid var(--line)}
.busca input{flex:1;border:0;outline:0;background:none;padding:14px 0;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.85rem;color:var(--mut)}
.cats button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* produtos */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 0 10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:920px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .ft{aspect-ratio:1;background:color-mix(in srgb,var(--ac) 12%,#fff);display:grid;place-items:center;font-size:44px;position:relative}
.prod .ft img{width:100%;height:100%;object-fit:cover}
.prod .tag{position:absolute;top:8px;left:8px;background:#fff;border-radius:99px;font-size:.68rem;font-weight:800;padding:3px 8px;color:var(--warn)}
.prod .tag.off{color:var(--bad)}
.prod .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod h3{font-size:.93rem;line-height:1.25}
.prod .ds{font-size:.78rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .pr{font-weight:800;font-size:1.05rem;margin-top:auto;padding-top:6px}
.add{margin-top:6px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;padding:10px;font-size:.88rem}
.add:disabled{background:#ddd5e3;color:#8a8093;cursor:not-allowed}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:6px;background:color-mix(in srgb,var(--ac) 14%,#fff);border-radius:12px;padding:3px}
.step button{width:36px;height:36px;border:0;border-radius:10px;background:#fff;font-size:1.15rem;font-weight:800;color:var(--ink)}
.step b{font-size:.98rem}
.vazio{text-align:center;color:var(--mut);padding:50px 10px}
.vazio .e{font-size:42px}
/* barra da sacola */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:20;pointer-events:none}
.bar button{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:18px;background:var(--ac);color:#fff;padding:15px 18px;font-weight:800;font-size:1rem;box-shadow:0 18px 40px -14px var(--ac);transform:translateY(0);transition:transform .25s}
.bar button .n{background:#fff;color:var(--ac);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.85rem;padding:0 6px}
.bar button .t{margin-left:auto}
.bar.hide button{transform:translateY(140%)}
/* folha (sacola / pedido) */
.sheet-bg{position:fixed;inset:0;background:rgba(15,10,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:99px;background:#d9d1df;margin:6px auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-h h2{font-family:'Fraunces',Georgia,serif;font-size:1.35rem}
.x{border:0;background:#ebe5ef;width:34px;height:34px;border-radius:50%;font-size:1rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.box h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:8px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .th{flex:none;width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--ac) 12%,#fff);display:grid;place-items:center;overflow:hidden;font-size:20px}
.it .th img{width:100%;height:100%;object-fit:cover}
.it .nm{flex:1;min-width:0;font-weight:700;font-size:.9rem}
.it .nm small{display:block;color:var(--mut);font-weight:600}
.it .step{margin:0;padding:2px;gap:6px}
.it .step button{width:30px;height:30px;font-size:1rem}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;background:#fff;width:100%;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 7%,#fff)}
.opt .r{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #c9bfd1;display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .r{border-color:var(--ac)}
.opt[aria-pressed="true"] .r:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ac)}
.opt b{display:block;font-size:.93rem}.opt span{font-size:.8rem;color:var(--mut)}
label.l{display:block;font-size:.8rem;font-weight:700;margin:12px 0 5px}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px}
.in:focus{outline:2px solid var(--ac);border-color:transparent}
.tot{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-top:6px}
.tot.g{font-size:1.15rem;color:var(--tx);font-weight:800;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:1rem;margin-top:14px;text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn.pri{background:var(--ac);color:#fff}
.btn.wa{background:#25d366;color:#06301a}
.btn.gh{background:transparent;border:1.5px solid var(--line);color:var(--tx)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);font-size:.86rem;font-weight:700;margin-top:10px;min-height:1em}
/* pedido feito */
.ok{text-align:center;padding:6px 0 2px}
.ok .c{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
.ok h2{font-family:'Fraunces',Georgia,serif;font-size:1.5rem}
.ok p{color:var(--mut);font-size:.9rem;margin-top:4px}
.trk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.trk div{text-align:center;font-size:.7rem;font-weight:700;color:var(--mut)}
.trk i{display:block;height:6px;border-radius:99px;background:#e6dfeb;margin-bottom:6px}
.trk .on{color:var(--tx)}.trk .on i{background:var(--ok)}
.qr{width:min(220px,64vw);aspect-ratio:1;margin:6px auto 0;background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%}
.cc{display:flex;gap:8px;margin-top:10px}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px;font:600 .8rem ui-monospace,monospace;background:#fff}
.cc button{border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;padding:0 14px}
.pill{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;padding:3px 9px}
.pill.ok{background:#dff4ea;color:var(--ok)}.pill.wait{background:#fdf1d8;color:var(--warn)}.pill.bad{background:#fde3e3;color:var(--bad)}
.fechada{max-width:520px;margin:30px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 20px}
.fechada .e{font-size:44px}
.fechada h2{font-family:'Fraunces',Georgia,serif;margin:8px 0 6px}
.meus{display:block;margin:6px auto 0;border:0;background:none;color:var(--mut);font-weight:700;text-decoration:underline;font-size:.86rem}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:24px 0 10px}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:.88rem;z-index:60;animation:fd .2s}
</style>
</head>
<body>
<div id="app"><div class="vazio" style="padding-top:120px"><div class="e">🛍️</div><p>Carregando a loja…</p></div></div>
<script src="/nichos.js"></script>
<script src="/qrcode.js"></script>
<script src="/loja.js"></script>
</body>
</html>
